services:
  - type: web
    name: trackship-ng
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: trackship-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/trackship
      - key: ALLOWED_ORIGINS
        value: https://appassets.trackship.ng
      - key: TRACKSHIP_IDENTITY_KEY
        generateValue: true
      - key: TRACKSHIP_ADMIN_TOKEN
        generateValue: true
      - key: TRACKSHIP_ENABLE_PAYOUTS
        value: "false"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
