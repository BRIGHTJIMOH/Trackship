# Review the paid web/database plans before applying this Blueprint.
databases:
  - name: sendrack-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: sendrack
    user: sendrack
    ipAllowList: []
services:
  - type: web
    name: sendrack-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: sendrack-db
          property: connectionString
      # Render's private internal database connection. Public connections require TLS.
      - key: DATABASE_SSL
        value: disable
      - key: ALLOWED_ORIGINS
        value: https://appassets.trackship.ng
      - key: TRACKSHIP_IDENTITY_KEY
        generateValue: true
      - key: TRACKSHIP_ADMIN_TOKEN
        generateValue: true
      - key: ADMIN_USERNAME
        value: owner
      - key: ADMIN_PASSWORD
        sync: false
      - key: TRACKSHIP_ENABLE_PAYOUTS
        value: "false"
      - key: TRACKSHIP_SEND_JOB_SMS
        value: "false"
      - key: TRACKSHIP_RIDER_CAPACITY
        value: "5"
# Add PAYSTACK_SECRET_KEY privately when your merchant account is ready.
# SMS provider settings are optional and are not requested by this Blueprint.
